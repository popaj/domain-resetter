<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset This Domain?</title>
    <style>
        :root {
            --primary-bg: #ffffff;
            --text-color: #333333;
            --accent-color: #0066cc;
            --danger-color: #d32f2f;
            --hover-danger-color: #b71c1c;
            --neutral-color: #757575;
            --hover-neutral-color: #616161;
            --button-radius: 4px;
            --padding-medium: 16px;
            --font-small: 14px;
            --font-medium: 16px;
            --font-large: 18px;
        }

        /* Prevent scrolling */
        html, body {
            height: 100%;
            margin: 0;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: var(--primary-bg);
        }

        .popup-container {
            background-color: var(--primary-bg);
            color: var(--text-color);
            padding: 20px;
            border-radius: 8px;
            max-width: 360px;
            min-width: 280px;
            text-align: center;
            box-sizing: border-box;
        }

        h3 {
            font-size: var(--font-large);
            margin-bottom: 15px;
        }

        p {
            font-size: var(--font-small);
            margin-bottom: 12px;
        }

        #hostname {
            font-weight: bold;
            color: var(--accent-color);
        }

        label {
            display: block;
            margin-top: 8px;
            font-size: 12px;
        }

        input[type="checkbox"] {
            margin-right: 5px;
        }

        .buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 20px;
        }

        button {
            padding: 8px 16px;
            border: none;
            border-radius: var(--button-radius);
            cursor: pointer;
            font-size: var(--font-small);
            transition: background-color 0.3s ease;
        }

        #confirm {
            background-color: var(--danger-color);
            color: white;
        }

        #cancel {
            background-color: var(--neutral-color);
            color: white;
        }

        button:focus-visible {
            outline: 3px solid var(--accent-color);
            outline-offset: 2px;
        }

        @media (max-width: 480px) {
            .popup-container { padding: 16px; }
        }
    </style>
</head>
<body role="dialog" aria-labelledby="popup-title">
    <div class="popup-container">
        <header>
            <h3 id="popup-title">Reset This Domain?</h3>
        </header>

        <main>
            <p id="popup-desc">
                Delete all history and cookies for 
                <span id="hostname">this domain</span> 
                <strong>and its parent domains</strong> (e.g., to log you out).
            </p>
            <label for="dontAskAgain">
                <input type="checkbox" id="dontAskAgain"> 
                Don't ask again
            </label>
        </main>

        <footer class="buttons">
            <button id="confirm">Confirm</button>
            <button id="cancel" aria-label="Cancel reset">Cancel</button>
        </footer>
    </div>

    <script src="popup.js"></script>
</body>

</html>
